    - name: Depot script mise a jour instances
      copy:
        dest: /usr/local/bin/update_instances_json.sh
        mode: '0755'
        content: |
          #!/bin/bash
          DEST="/var/www/html/containers.json"
          declare -A IPS=( [apache]="{{ new_ips.apache }}" [backup]="{{ new_ips.backup }}" [db1]="{{ new_ips.db1 }}" [ftp]="{{ new_ips.ftp }}" [mariadb]="{{ new_ips.mariadb }}" [nfs]="{{ new_ips.nfs }}" [web1]="{{ new_ips.web1 }}" )
          declare -A PORTS=( [apache]="80" [backup]="22" [db1]="3306" [ftp]="21" [mariadb]="3306" [nfs]="2049" [web1]="80" )
          check_tcp() { timeout 2 bash -c "echo >/dev/tcp/$1/$2" 2>/dev/null && echo RUNNING || echo STOPPED; }
          order="apache backup db1 ftp mariadb nfs web1"
          containers="[" total=0 running=0 first=true
          for name in $order; do
            ip="${IPS[$name]}" port="${PORTS[$name]}"
            state=$(check_tcp "$ip" "$port")
            [ "$first" = true ] && first=false || containers+=","
            containers+="{\"name\":\"$name\",\"state\":\"$state\",\"autostart\":\"1\",\"groups\":\"-\",\"ipv4\":\"$ip\",\"ipv6\":\"-\",\"unprivileged\":\"false\"}"
            total=$((total+1)); [ "$state" = RUNNING ] && running=$((running+1))
          done
          containers+="]"
          stopped=$((total-running))
          updated=$(date '+%Y-%m-%d %H:%M:%S')
          printf '{"containers":%s,"total":%d,"running":%d,"stopped":%d,"updated":"%s"}' "$containers" "$total" "$running" "$stopped" "$updated" > "$DEST"

    - name: Generation initiale containers.json
      command: /usr/local/bin/update_instances_json.sh

    - name: Cron mise a jour instances (chaque minute)
      cron:
        name: update instances json
        job: /usr/local/bin/update_instances_json.sh
        user: root

    - name: Cron mise a jour instances (30s)
      cron:
        name: update instances json 30s
        job: sleep 30 && /usr/local/bin/update_instances_json.sh
        user: root

    - name: Redemarrage Apache
      service:
        name: apache2
        state: restarted

- name: Restauration web1
  hosts: web1
  become: true
  tasks:
    - name: Creation du repertoire de staging
      file:
        path: "{{ staging_dir }}"
        state: directory
        mode: '0700'
    - name: Decompression config Apache
      unarchive:
        src: "{{ staging_dir }}/web1_apache2.tar.gz"
        dest: /etc/
        remote_src: yes
    - name: Remise a zero ports.conf (evite Listen IP-specifique de l'ancien LXC)
      copy:
        dest: /etc/apache2/ports.conf
        content: |
          Listen 80
          <IfModule ssl_module>
              Listen 443
          </IfModule>
          <IfModule mod_gnutls.c>
              Listen 443
          </IfModule>
    - name: Correction MPM (evite conflit mpm_event + mpm_prefork apres restauration)
      shell: |
        a2dismod mpm_event mpm_worker 2>/dev/null || true
        a2enmod mpm_prefork
      changed_when: false
    - name: Activation module rewrite
      command: a2enmod rewrite
      changed_when: false
    - name: Verification syntaxe Apache avant redemarrage
      command: apache2ctl -t
      changed_when: false
      register: apache_configtest
      failed_when: apache_configtest.rc != 0

    - name: Decompression archive HTML (pas de NFS detecte)
      unarchive:
        src: "{{ staging_dir }}/web1_html.tar.gz"
        dest: /var/www/
        remote_src: yes

    - name: Ecriture /etc/hosts avec IPs internes
      blockinfile:
        path: /etc/hosts
        block: |
          {{ new_ips.apache }} apache.migration.local
          {{ new_ips.backup }} backup.migration.local
          {{ new_ips.db1 }} db1.migration.local
          {{ new_ips.ftp }} ftp.migration.local
          {{ new_ips.mariadb }} mariadb.migration.local
          {{ new_ips.nfs }} nfs.migration.local
          {{ new_ips.web1 }} web1.migration.local

