# Généré automatiquement par l'orchestrateur depuis config.yml
---
ansible_user: ubuntu
ansible_ssh_private_key_file: ~/.ssh/migration_key
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
staging_dir: "/tmp/migration_staging"
new_ips:
  apache: "10.10.0.161"
  backup: "10.10.0.177"
  db1: "10.10.0.62"
  ftp: "10.10.0.246"
  mariadb: "10.10.0.186"
  nfs: "10.10.0.75"
  web1: "10.10.0.122"
